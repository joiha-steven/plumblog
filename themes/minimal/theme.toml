# minimal: sans-serif, monochrome, one accent. Reading first.
name = "minimal"
version = "0.1.0"
font_license = "Inter: SIL Open Font License 1.1, see assets/fonts/license-inter.txt"

[fonts]
family = "Inter"
# Generated by scripts/subset-fonts; inlined before style.css. "{{fonts}}" is replaced with the
# public URL of assets/fonts.
faces = "assets/fonts/faces.css"
# Preload the body latin subset, plus the subset of the page language so its letters do not
# swap in late and nudge the layout. Other scripts load only when a page uses them.
preload = ["assets/fonts/inter-latin.woff2"]
preload_by_lang = { vi = "assets/fonts/inter-vietnamese.woff2", ru = "assets/fonts/inter-cyrillic.woff2", uk = "assets/fonts/inter-cyrillic.woff2", bg = "assets/fonts/inter-cyrillic.woff2", sr = "assets/fonts/inter-cyrillic.woff2", el = "assets/fonts/inter-greek.woff2" }

[js]
# Theme toggle + sidenotes. Deferred; the page works fully without it.
files = ["assets/minimal.js"]

# Each key becomes a CSS custom property --c-<key>. Both modes must define the same keys.
# Contrast on bg: text >= 7:1, text-2 and accent >= 4.5:1 (checked by `blog theme check`).
[colors.light]
bg = "#ffffff"
text = "#1a1a1a"     # near-black: softer than #000 on white, still ~17:1
text-2 = "#646464"   # dates, captions, meta
rule = "#e5e5e3"     # hairlines, table rules
surface = "#f5f5f3"  # code blocks, inline code, table head
accent = "#8a2d6f"   # plum; owner-changeable
code = "#1a1a1a"

[colors.dark]
bg = "#141414"
text = "#e6e4e0"     # off-white: full white on near-black blooms (halation)
text-2 = "#9d9b97"
rule = "#2b2b2a"
surface = "#1d1d1c"
accent = "#e3a3d3"
code = "#e6e4e0"
