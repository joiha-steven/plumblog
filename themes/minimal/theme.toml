# minimal: sans-serif, monochrome, one accent. Reading first.
name = "minimal"
version = "0.2.0"
font_license = "Inter: SIL Open Font License 1.1, see assets/fonts/license-inter.txt"

# Plugin slots the templates fill with slot(); a plugin partial for any other slot is not shown.
slots = ["head", "body_start", "body_end", "before_post", "after_post", "footer"]

[fonts]
family = "Inter"
# Generated by scripts/subset-fonts; inlined before style.css. "{{fonts}}" is replaced with the
# public URL of assets/fonts.
faces = "assets/fonts/faces.css"
# Preload the body latin subset and the title cut, plus the subsets of the page language so its
# letters do not swap in late and nudge the layout. Other scripts load only when a page uses them.
# Mono is preloaded too: the writer style sets the site name and dates in it, above the fold.
preload = ["assets/fonts/inter-latin.woff2", "assets/fonts/inter-display-latin.woff2", "assets/fonts/mono-latin.woff2"]
preload_by_lang = { vi = ["assets/fonts/inter-vietnamese.woff2", "assets/fonts/inter-display-vietnamese.woff2", "assets/fonts/mono-vietnamese.woff2"], ru = ["assets/fonts/inter-cyrillic.woff2"], uk = ["assets/fonts/inter-cyrillic.woff2"], bg = ["assets/fonts/inter-cyrillic.woff2"], sr = ["assets/fonts/inter-cyrillic.woff2"], el = ["assets/fonts/inter-greek.woff2"] }

[js]
# Theme toggle, sidenotes, copy-code button. Deferred; every page works fully without it.
files = ["assets/minimal.js"]

# Options the owner can change. The admin draws a control for each from this table: `type`
# picks the control, `label` and `help` are keys in this theme's locales/, `default` is used until
# the owner changes it. Templates read the chosen values as theme.options.<name>.
# Options use only the admin's field types (docs/ARCHITECTURE.md, "Plugins and options"); the admin
# renders them. Labels and help are locale keys; icons are names from the admin icon set.
[groups.look]
label = "options.group_look"
icon = "palette"

[groups.reading]
label = "options.group_reading"
icon = "book-open"

[options.style]
type = "choice"
group = "look"
label = "options.style"
help = "options.style_help"
default = "writer"
# Each choice adds one stylesheet after style.css; readers get only the chosen one.
# Drafts stay out of the admin and the shipped CSS until they meet the writer standard.
choices = [
  { value = "writer", label = "options.style_writer", css = "styles/writer.css" },
  { value = "book", label = "options.style_book", css = "styles/book.css", draft = true },
  { value = "magazine", label = "options.style_magazine", css = "styles/magazine.css", draft = true },
]

[options.accent]
type = "color"
group = "look"
label = "options.accent"
help = "options.accent_help"
token = "accent" # overrides --c-accent; `blog theme check` rejects pairs below 4.5:1 contrast
default = { light = "#8a2d6f", dark = "#e2a3d2" }

[options.list_images]
type = "toggle"
group = "look"
label = "options.list_images"
default = false

[options.excerpt_words]
type = "number"
group = "reading"
label = "options.excerpt_words"
help = "options.excerpt_words_help"
min = 0
max = 120
step = 5
default = 55 # core cuts the auto excerpt at a word boundary; 0 hides excerpts

[options.sidenotes]
type = "toggle"
group = "reading"
label = "options.sidenotes"
help = "options.sidenotes_help"
default = true

# Each key becomes a CSS custom property --c-<key>. Both modes must define the same keys.
# Contrast on bg: text >= 7:1; text-2 and accent >= 4.5:1. Syntax colors >= 4.5:1 on surface.
# Neutrals lean slightly toward the plum accent so greys read as chosen, not default.
[colors.light]
bg = "#ffffff"
text = "#1c181b"      # near-black, plum-tinted
text-2 = "#685f66"    # dates, captions, excerpts
rule = "#ebe5ea"      # hairlines
surface = "#f7f4f6"   # code blocks, inline code, table head
accent = "#8a2d6f"    # plum; owner-changeable
on-accent = "#ffffff" # check marks and text on accent fills
code = "#2a2328"
# Controls (one recipe with the admin): raised = border + top highlight + contact shadow;
# inset = field background one step down + inner shadow.
border = "#d9d2d7"
field = "#f3eff2"
raise-hi = "#ffffffb3"
raise-lo = "#0000000f"
well = "#0000000f"
syn-keyword = "#8a2d6f"
syn-string = "#2c6e46"
syn-number = "#9a4a0a"
syn-function = "#2556a0"
syn-type = "#6340a8"
syn-comment = "#766c74"
syn-property = "#1d6672"
syn-punct = "#685f66"

[colors.dark]
bg = "#151215"
text = "#ebe5e9"      # off-white: full white on near-black blooms (halation)
text-2 = "#a59aa2"
rule = "#2d272c"
surface = "#1e1a1e"
accent = "#e2a3d2"
on-accent = "#1a1218"
code = "#e3dce1"
border = "#3a3338"
field = "#100d10"
raise-hi = "#ffffff0f"
raise-lo = "#00000080"
well = "#00000059"
syn-keyword = "#e2a3d2"
syn-string = "#9fd4ad"
syn-number = "#f0b878"
syn-function = "#94b9f2"
syn-type = "#c7adf2"
syn-comment = "#8d838b"
syn-property = "#86cdd6"
syn-punct = "#a59aa2"
