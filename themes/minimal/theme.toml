# minimal: sans-serif, monochrome, one accent. Reading first.
name = "minimal"
version = "0.2.0"
font_license = "Inter: SIL Open Font License 1.1, see assets/fonts/license-inter.txt"

[fonts]
family = "Inter"
# Generated by scripts/subset-fonts; inlined before style.css. "{{fonts}}" is replaced with the
# public URL of assets/fonts.
faces = "assets/fonts/faces.css"
# Preload the body latin subset and the title cut, plus the subsets of the page language so its
# letters do not swap in late and nudge the layout. Other scripts load only when a page uses them.
preload = ["assets/fonts/inter-latin.woff2", "assets/fonts/inter-display-latin.woff2"]
preload_by_lang = { vi = ["assets/fonts/inter-vietnamese.woff2", "assets/fonts/inter-display-vietnamese.woff2"], ru = ["assets/fonts/inter-cyrillic.woff2"], uk = ["assets/fonts/inter-cyrillic.woff2"], bg = ["assets/fonts/inter-cyrillic.woff2"], sr = ["assets/fonts/inter-cyrillic.woff2"], el = ["assets/fonts/inter-greek.woff2"] }

[js]
# Theme toggle, sidenotes, copy-code button. Deferred; every page works fully without it.
files = ["assets/minimal.js"]

# Each key becomes a CSS custom property --c-<key>. Both modes must define the same keys.
# Contrast on bg: text >= 7:1; text-2 and accent >= 4.5:1. Syntax colors >= 4.5:1 on surface.
# Neutrals lean slightly toward the plum accent so greys read as chosen, not default.
[colors.light]
bg = "#ffffff"
text = "#1c181b"      # near-black, plum-tinted
text-2 = "#685f66"    # dates, captions, excerpts
rule = "#ebe5ea"      # hairlines
surface = "#f7f4f6"   # code blocks, inline code, table head
accent = "#8a2d6f"    # plum; owner-changeable
on-accent = "#ffffff" # check marks and text on accent fills
code = "#2a2328"
syn-keyword = "#8a2d6f"
syn-string = "#2c6e46"
syn-number = "#9a4a0a"
syn-function = "#2556a0"
syn-type = "#6340a8"
syn-comment = "#766c74"
syn-property = "#1d6672"
syn-punct = "#685f66"

[colors.dark]
bg = "#151215"
text = "#ebe5e9"      # off-white: full white on near-black blooms (halation)
text-2 = "#a59aa2"
rule = "#2d272c"
surface = "#1e1a1e"
accent = "#e2a3d2"
on-accent = "#1a1218"
code = "#e3dce1"
syn-keyword = "#e2a3d2"
syn-string = "#9fd4ad"
syn-number = "#f0b878"
syn-function = "#94b9f2"
syn-type = "#c7adf2"
syn-comment = "#8d838b"
syn-property = "#86cdd6"
syn-punct = "#a59aa2"
