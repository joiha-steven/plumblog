# Text of the minimal theme, English. Templates call t("section.key", name=value);
# {name} placeholders are filled from those arguments.
[site]
# The page description when the site and the page have none.
description_fallback = "Posts from {site}"

[nav]
search = "Search"
skip_to_content = "Skip to content"
site = "Site"
toggle_theme = "Switch light or dark"
feed = "RSS"

[home]
pinned = "Pinned"
pages = "Pages"
older_posts = "Older posts"
newer_posts = "Newer posts"

[post]
page_title = "{title} - {site}"
reading_time = "{minutes} min read"
tag = "#{name}"
series = "Series:"
posts = "Posts"
previous = "Previous"
next = "Next"
copy_code = "Copy"
copied = "Copied"
# {n} is filled in by the sidenote script, per note.
show_note = "Show note {n}"

[search]
placeholder = "Search posts"
close = "Close search"
error = "Search failed. Check your connection and try again."
see_all = "See all results"
title = "Search"
submit = "Search"
hint = "Search titles and text of every post."
count_one = "1 post for “{query}”"
count_other = "{count} posts for “{query}”"
none = "Nothing found for “{query}”. Try fewer or different words."
count_more = "The {count} newest posts for “{query}”. Add a word to narrow it down."

[comments]
title = "Comments"
owner = "Author"
empty = "No comments yet."
closed = "Comments are closed."
name = "Name"
body = "Comment"
submit = "Send comment"
moderated = "Comments appear after the author approves them."
notice_pending = "Thanks. Your comment will appear once it is approved."
notice_error = "Your comment was not sent. Check your connection and try again; your text is still here."
check_failed = "The spam check could not load, so the comment cannot be sent yet. Reload the page and try again."
latest_only = "Only the newest {n} comments are shown."
needs_js = "Sending a comment needs JavaScript (for the spam check). Reading works without it."
error_unavailable = "Comments cannot be sent right now. Please try again later."
error_closed = "Comments are closed on this post."
error_name = "Enter a name of 1 to {n} characters."
error_body = "Write a comment of 1 to {n} characters."
error_links = "Too many links: a comment may hold at most {n}."
error_form = "The form could not be read. Please try again."
error_check = "The spam check did not pass. Please try again; your text is still here."
error_rate = "Too many comments from your connection. Please wait a few minutes."

[date]
# Post dates in lists and post headers; {month} is one of the month_N names below.
short = "{month} {day}, {year}"
month_1 = "Jan"
month_2 = "Feb"
month_3 = "Mar"
month_4 = "Apr"
month_5 = "May"
month_6 = "Jun"
month_7 = "Jul"
month_8 = "Aug"
month_9 = "Sep"
month_10 = "Oct"
month_11 = "Nov"
month_12 = "Dec"

[tag]
title = "#{name}"

[series]
# Paging runs in reading order: earlier parts first.
earlier_posts = "Earlier parts"
later_posts = "Later parts"

[archive]
title = "Posts from {year}"
years = "Years"

[notfound]
title = "Page not found"
text = "This page does not exist or has moved."
home = "Go to the home page"
recent = "Recent posts"

# Labels for the owner's theme options (theme.toml [options]).
[options]
group_look = "Look"
group_reading = "Reading"
style = "Style"
style_help = "How the whole site looks. Every style keeps the same reading comfort."
style_writer = "Writer"
style_book = "Book"
style_magazine = "Magazine"
accent = "Accent color"
accent_help = "Used for links, the focus ring and text selection."
list_images = "Show images in the post list"
excerpt_words = "Excerpt length (words)"
excerpt_words_help = "Used when a post has no excerpt of its own. 0 hides excerpts."
sidenotes = "Notes beside the text"
sidenotes_help = "Off: notes stay at the end of the post."
