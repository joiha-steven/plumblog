# Dev-only Worker config for local tests (tools/worker-test). Never deployed:
# the real wrangler.toml is generated per site by `blog` and gitignored.
# Paths are relative to this file. tools/worker-test/harness.mjs builds `main` first.
name = "plumblog-dev"
main = "../target/worker-dev/worker/shim.mjs"
compatibility_date = "2026-11-01"

# Theme fonts and JS as static assets, at the URL crates/worker pages::THEME_ASSETS_URL names.
# scripts/worker-test copies themes/minimal/assets here before starting wrangler.
[assets]
directory = "../target/worker-dev/assets"

# Binding names are provisional until the store adapters land; keep them in sync with crates/worker.
# Daily system log retention (crates/worker jobs). Tests fire it through /__scheduled.
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "plumblog-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "plumblog-dev"

# Lets a test build (feature contract-tests) serve /__contract, which empties the database.
[vars]
PLUMBLOG_CONTRACT_TESTS = "wipe-db"
