# Dev-only Worker config for local tests (tools/worker-test). Never deployed:
# the real wrangler.toml is generated per site by `blog` and gitignored.
# Paths are relative to this file. tools/worker-test/harness.mjs builds `main` first.
name = "plumblog-dev"
main = "../target/worker-dev/worker/shim.mjs"
compatibility_date = "2026-11-01"

# Theme fonts and JS as static assets, at the URL crates/worker pages::THEME_ASSETS_URL names.
# scripts/worker-test copies themes/minimal/assets here before starting wrangler.
[assets]
directory = "../target/worker-dev/assets"

# Binding names are provisional until the store adapters land; keep them in sync with crates/worker.
# One cron, every 10 minutes (crates/worker jobs): publish due posts, send due webhook
# deliveries; the 03:10 UTC run also prunes the system log and old deliveries. Tests fire it
# through /__scheduled (pass &time= to pick the slot).
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "plumblog-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "plumblog-dev"

# Lets a test build (feature contract-tests) serve /__contract, which empties the database,
# and /__webhooks/*.
[vars]
PLUMBLOG_CONTRACT_TESTS = "wipe-db"
# Test builds only: webhooks may deliver to the local test receiver over http://127.0.0.1.
PLUMBLOG_WEBHOOK_TEST_RECEIVER = "allow-loopback-http"
# TEST-ONLY key (bytes 0..31), public on purpose. A real site gets a random one as a Worker
# secret (`wrangler secret put WEBHOOK_KEY`), never a var.
WEBHOOK_KEY = "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
