[workspace]
resolver = "3"
members = ["crates/core", "crates/worker", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# The ONLY place versions live. One line of "why" per dependency.
[workspace.dependencies]
# Cloudflare Workers runtime bindings (fetch handler, D1, R2); no other way to run Rust on Workers.
worker = "0.9.0"
# Argument parsing for the `blog` CLI; derive keeps commands declarative.
clap = { version = "4.6.7", features = ["derive"] }
# Internal crate shared by worker and cli.
plumblog-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Small wasm matters: the free plan limits Worker size and startup CPU.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
