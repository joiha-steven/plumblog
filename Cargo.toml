[workspace]
resolver = "3"
members = [
  "crates/model",
  "crates/markdown",
  "crates/i18n",
  "crates/auth",
  "crates/syslog",
  "crates/store",
  "crates/webhook",
  "crates/render",
  "crates/worker",
  "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# The ONLY place versions live. One line of "why" per dependency.
[workspace.dependencies]
# Cloudflare Workers runtime bindings (fetch handler, D1, R2); no other way to run Rust on Workers.
# d1: bindings for the D1 store adapter (crates/worker/src/d1).
worker = { version = "0.9.0", features = ["d1"] }
# Argument parsing for the `blog` CLI; derive keeps commands declarative.
clap = { version = "4.6.7", features = ["derive"] }
# NFC before slugging so the same heading typed on macOS (NFD) and elsewhere (NFC) gets one id;
# composition tables are too large to hand-write correctly.
unicode-normalization = "0.1.26"
# Tests only (store): comment names drop every format character (General_Category Cf). The
# runtime uses a small const table; a test checks it against these Unicode tables so it cannot
# drift, at no wasm cost (the full category table would add 17 KB).
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
# Theme templates are Jinja (docs/ARCHITECTURE.md, Themes); a template engine with inheritance,
# macros and autoescape is far more code than a dependency. Only the features templates use.
minijinja = { version = "3.1.0", default-features = false, features = ["builtins", "macros", "multi_template", "adjacent_loop_items", "serde"] }
# theme.toml and theme locale files are TOML; parse-only, no writer.
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
# Typed theme.toml and template data; minijinja and toml both speak serde.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
# Stored theme/plugin option values are JSON (store: extension_options.value_json); a correct
# JSON parser is more code than this, and the Worker already links it through `worker`.
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
# CommonMark + GFM parser for rendering posts on save; a correct CommonMark parser is far
# too much code to own. Default features off: we write our own HTML, so no `html` module.
pulldown-cmark = { version = "0.13.6", default-features = false }
# LaTeX math to MathML at save time, so readers need no math JS (~70 KB gzip in wasm, measured).
pulldown-latex = "0.8.0"
# Tests only: a real XML parser proves feeds and the sitemap parse; the hand checker can share
# blind spots with the writer it tests. Not linked into the Worker.
roxmltree = "0.21.2"
# `blog` talks to the Cloudflare REST API (issue #7): blocking HTTP over rustls (ring, bundled
# webpki roots), so no async runtime and no system OpenSSL; far smaller than reqwest. TLS and
# HTTP/1.1 are not code to own. Default features off: no gzip decoder.
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
# `blog setup` makes WEBHOOK_KEY, the site id and the setup code from the OS random source;
# already in the lock through ring, so no new code.
getrandom = "0.2.17"
# Release signatures (issue #21): Ed25519 verify for `blog update` and signing in `blog-release`.
# Already linked through ureq's rustls, so no new code ships; Ed25519 is not code to own.
ring = { version = "0.17.14", default-features = false }
# Release archives are .tar.gz (and .zip on Windows): a raw DEFLATE decoder. Inflate is subtle,
# security-relevant code; miniz_oxide is pure Rust, no unsafe, and is what Rust's own std uses.
# The gzip/tar/zip containers around it are a few small, strict readers in crates/cli.
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
# Tests only: the fake Cloudflare D1 (crates/cli/tests/fake_cf) runs the repo's migrations and
# setup's SQL in real SQLite, so tests assert the rows the Worker reads. Bundled: no system
# SQLite, and FTS5 is compiled in. Never linked into `blog` or the Worker.
rusqlite = { version = "0.39", features = ["bundled"] }
# Pinned to the stub back end of `idna` (via `url`, only through `worker`): no Unicode tables, so
# 48 KB gzip less in the wasm. Costs: a non-ASCII host is refused ("invalid international domain
# name"; we ask for the `xn--` form), and `xn--` labels are accepted without the UTS 46 checks
# (bidi, joining, validity). Hosts here come from the owner's settings or the platform, which
# send punycode already. Other versions of this crate pull in ICU4X or unicode-rs.
idna_adapter = "=1.0.0"
# Internal module crates; allowed edges between them are enforced by scripts/check.
plumblog-model = { path = "crates/model" }
plumblog-markdown = { path = "crates/markdown" }
plumblog-i18n = { path = "crates/i18n" }
plumblog-auth = { path = "crates/auth" }
plumblog-syslog = { path = "crates/syslog" }
plumblog-store = { path = "crates/store" }
plumblog-webhook = { path = "crates/webhook" }
plumblog-render = { path = "crates/render" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Small wasm matters: the free plan limits Worker size and startup CPU.
[profile.release]
# "s", not "z" (issue #50, measured on the deployed wasm): "z" ships 769 KB instead of 879 KB
# but renders a long post about twice as slowly (0.54 -> 1.31 ms natively, over the 2 ms
# budget on CI runners), and CPU (10 ms per request) is the scarcer limit. "z" everywhere but
# the render path saved only 20 KB more than this.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
