[package]
name = "plumblog-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "blog"
path = "src/main.rs"

[[bin]]
name = "blog-release"
path = "src/bin/blog-release.rs"

[dependencies]
clap.workspace = true
plumblog-i18n.workspace = true
plumblog-render.workspace = true
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
plumblog-auth.workspace = true
plumblog-store.workspace = true
# `blog guide api` prints the route table; the deploy and migration entries in the site's system
# log are built the way the Worker builds them.
plumblog-model.workspace = true
plumblog-syslog.workspace = true
getrandom.workspace = true
# Writing site.local.toml needs the serializer, which the Worker's crates do not.
toml = { workspace = true, features = ["display", "serde"] }
# Release signatures and archives (`blog update`, `blog deploy` downloads, `blog-release`).
ring.workspace = true
miniz_oxide.workspace = true

[dev-dependencies]
rusqlite.workspace = true
# WEBHOOK_KEY must parse exactly as the Worker reads it.
plumblog-webhook.workspace = true

[lints]
workspace = true
