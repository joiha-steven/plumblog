[package]
name = "plumblog-i18n"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# TOML -> JSON conversion (`toml_to_json`, `parse_toml`). Off for the Worker, which links no
# TOML parser (docs/ARCHITECTURE.md, Budgets); on for the CLI, the Worker's build script and
# the tests.
toml = ["dep:toml"]

[dependencies]
plumblog-model.workspace = true
serde_json.workspace = true
toml = { workspace = true, optional = true }

[dev-dependencies]
# The unit tests write locale files as TOML.
plumblog-i18n = { workspace = true, features = ["toml"] }

[lints]
workspace = true
