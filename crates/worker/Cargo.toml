[package]
name = "plumblog-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Test builds only (scripts/worker-test): the /__contract route runs the store contract suite
# against real D1. Never enabled for deploy, so release wasm has no such route.
contract-tests = ["plumblog-store/contract"]

[dependencies]
worker.workspace = true
plumblog-model.workspace = true
plumblog-markdown.workspace = true
plumblog-render.workspace = true
plumblog-i18n.workspace = true
plumblog-store.workspace = true
plumblog-syslog.workspace = true

[dev-dependencies]
roxmltree.workspace = true

[lints]
workspace = true
