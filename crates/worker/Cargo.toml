[package]
name = "plumblog-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Test builds only (scripts/worker-test): the /__contract route runs the store contract suite
# against real D1, and /__webhooks/* may deliver to a local http receiver. Never enabled for
# deploy, so release wasm has no such route and no loopback policy.
contract-tests = ["plumblog-store/contract", "plumblog-webhook/test-receiver"]

[dependencies]
worker.workspace = true
futures-core.workspace = true
idna_adapter.workspace = true
plumblog-model.workspace = true
plumblog-auth.workspace = true
plumblog-markdown.workspace = true
plumblog-render.workspace = true
plumblog-i18n.workspace = true
plumblog-store.workspace = true
plumblog-syslog.workspace = true
plumblog-webhook.workspace = true

[build-dependencies]
# Converts the embedded TOML to JSON at build time; the `toml` feature never reaches the wasm
# (a build dependency runs on the build machine only).
plumblog-render = { workspace = true, features = ["toml"] }

[dev-dependencies]
roxmltree.workspace = true
rusqlite.workspace = true
serde_json.workspace = true

# worker-build's wasm-opt step, as scripts/build-bundle and scripts/check run it. Explicit args
# replace its default (`-O --debuginfo`; it appends the --enable-* feature flags itself), so
# those two stay and the new ones are added. Measured 2026-11-28: gzip 1,065,608 -> 1,055,588 bytes (raw 2,646,798 -> 2,663,809),
# render time unchanged within noise (60 interleaved warm misses per page, wrangler dev; docs/ARCHITECTURE.md,
# Wasm budget). Turning one-caller inlining off is what saves most; --converge adds a little.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--debuginfo", "--converge", "--one-caller-inline-max-function-size=0"]

[lints]
workspace = true
