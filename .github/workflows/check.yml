name: check
# Branch pushes are covered by their PR run; running both doubled the CI queue.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the older run useless; main runs always finish.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes ~5 min; a hung Worker test must fail fast, not hold the PR for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (reads rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target list --installed | grep -qx wasm32-unknown-unknown
      # Node runs the local Worker tests (scripts/worker-test); npm cache keyed on the pinned lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: actions/cache@v4
        with:
          # target/ also holds the pinned worker-build binary (target/tools);
          # ~/.cache/worker-build holds the wasm-bindgen and esbuild it downloads.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/worker-build
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/worker-test') }}
          restore-keys: cargo-
      - run: scripts/check
