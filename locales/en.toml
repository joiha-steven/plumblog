[cli]
# The `blog` command line. Every error line: the stable code, then the message.
error_line = "error [{code}]: {message}"
about = "plumblog command line"
lang_help = "Language of messages (en, vi). Default: PLUMBLOG_LANG, then the system language"
lang_value = "LANG"

[cli.guide]
about = "List guides, or print one by topic"
topic_help = "Guide topic (file name without .md)"
list_head = "Guides (run `blog guide <topic>`):"
options_summary = "Theme and plugin option schema (generated from code)"
token_summary = "Create the Cloudflare API token blog needs (generated from code)"
topic_value = "TOPIC"

[cli.setup]
about = "Set up the blog on Cloudflare (only the token check exists so far)"
check_token_help = "Check the Cloudflare API token and show which account it will use"
token_ok = "Cloudflare API token is valid ({kind})."
token_ok_expires = "Cloudflare API token is valid ({kind}, expires {date})."
kind_user = "user token"
kind_account = "account token"
account = "Account: {name} ({id})"

[cli.help]
# Our own help screen; clap's English help is turned off.
usage = "Usage: {usage}"
commands = "Commands:"
arguments = "Arguments:"
options = "Options:"
options_placeholder = "[OPTIONS]"
command_placeholder = "[COMMAND]"
help_help = "Print help"
version_help = "Print version"

[cli.args]
# A command line clap cannot parse; {arg} is the offending argument as typed.
unknown = "Unknown option or command: {arg}."
missing_value = "This option needs a value: {arg}."
missing_required = "A required option is missing: {arg}."
invalid_value = "This value is not allowed: {arg}."
not_usable = "These arguments cannot be used: {arg}."
hint = "Run `blog --help` to see what is allowed."

[cli.call]
# What a Cloudflare API call does; read as "to ...", e.g. "needed to {what}".
user_token_verify = "verify the token"
account_token_verify = "verify an account-owned token"
accounts_list = "list the accounts the token can see"
d1_list = "list D1 databases"
d1_create = "create the D1 database"
d1_query = "run migrations and queries"
d1_bookmark = "take a Time Travel bookmark before a migration"
d1_restore = "restore the database to a bookmark"
d1_export = "export the database as a backup"
r2_list = "list R2 buckets"
r2_create = "create the media bucket"
script_upload = "upload the Worker the first time"
version_upload = "upload a new Worker version"
version_list = "list Worker versions"
deployment_create = "deploy or roll back a version"
deployment_list = "find the active version"
assets_session = "start a static assets upload"
assets_upload = "upload static assets"
secret_put = "set Worker secrets"
secret_list = "list Worker secret names"
schedules_put = "set the cron trigger"
subdomain_get = "read the account's workers.dev subdomain"
script_subdomain_set = "turn on the workers.dev address"
domain_list = "list custom domains"
domain_attach = "attach the custom domain"
zones_list = "find the custom domain's zone"
turnstile_create = "create the Turnstile widget"
turnstile_list = "list Turnstile widgets"
turnstile_get = "read the Turnstile widget"

[cli.error]
# {call} is the API method and path, {reply} Cloudflare's own status and words (not translated).
token_missing = "No Cloudflare API token. Set {token_var} in the environment or in .env in this folder. Run `blog guide token` to see how to create one."
token_malformed = "{token_var} is not a valid token: it is empty or has spaces or unusual characters. Copy it again from {page}."
account_id_invalid = "{account_var} is not an account id: \"{id}\". Copy the Account ID from the Cloudflare dashboard, or remove the line to use the token's only account."
account_id_is_token = "{account_var} holds the API token, not the account id. The two lines in .env are probably swapped: put the token in {token_var} and the Account ID in {account_var}."
dotenv_unreadable = "Cannot read {path}: {reason}."
dotenv_line_invalid = "Line {line} of .env is not KEY=VALUE. (The line is not shown because it may hold the token.)"
token_invalid = "Cloudflare does not accept this API token: it is wrong, deleted or was rolled. Create a new one (`blog guide token`) and put it in {token_var}."
token_disabled = "This API token is turned off. Turn it back on at {page}, or create a new one (`blog guide token`)."
token_expired = "This API token has expired. Create a new one (`blog guide token`), or extend its TTL at {page}."
token_expired_on = "This API token expired on {date}. Create a new one (`blog guide token`), or extend its TTL at {page}."
token_inactive = "This API token is not active (status \"{status}\"). Check it at {page}."
account_none = "The API token cannot see any Cloudflare account. Edit the token and, under Account Resources, include your account (`blog guide token`)."
account_ambiguous = "The API token can see several accounts. Choose one by setting {account_var} in .env to its id:{list}"
account_not_visible = "The API token cannot see account {id} ({account_var}). Fix {account_var}, or include that account in the token's Account Resources. Accounts it can see:{list}"
account_list_empty = " none"
permission_missing = "The API token is missing the permission \"{permission}\", needed to {what} ({call}: {reply}). Add it to the token at {page} (Edit, then Permissions), and check that its Account Resources include this account. `blog guide token` lists every permission."
access_denied = "Cloudflare refused to {what} ({call}: {reply}). Check that the token's Account Resources include this account (`blog guide token`)."
http_failed = "Cloudflare returned an error while trying to {what} ({call}: {reply})."
network = "Could not reach Cloudflare to {what} ({call}) after {tries}: {detail}. Check the internet connection and try again."
network_write_uncertain = "The connection to Cloudflare broke while trying to {what} ({call}): {detail}. The change may already have been made, so do not simply repeat it: check the Cloudflare dashboard first. Running `blog setup` again finds what already exists by name."
reply_malformed = "Cloudflare sent a reply blog cannot read while trying to {what} ({call}: {reply}). Try again; if it keeps happening, report it with this message."
base_refused = "{var} may only point at a local test server (http://127.0.0.1:<port> or http://[::1]:<port>); refusing \"{value}\". Unset it to use the Cloudflare API."
internal = "Internal error in blog: {detail}. Please report it with this message."
guide_unknown = "Unknown guide topic: {topic}"
tries = { one = "{count} try", other = "{count} tries" }

[cli.guide_token]
# `blog guide token`. Button and field names (Create Token, Account Resources...) are the
# Cloudflare dashboard's own English labels; keep them as they are.
title = "# Cloudflare API token"
intro = "How to create the API token `blog` uses (generated from the code's table of API calls)."
global_key = "Never use the Global API Key: it can change everything in every account you own, and `blog` cannot use it. Create a scoped API token instead."
step_open = "1. Open {page}, choose Create Token, then Custom token."
step_permissions = "2. Under Permissions, add one row per line below, choosing the three dropdowns as shown."
account_heading = "Account permissions (always needed):"
zone_heading = "Zone permissions (only when the blog uses a custom domain):"
table_head = "| Type | Permission | Access | Used to |"
step_account_resources = "3. Account Resources: Include, then your one account (not All accounts)."
step_zone_resources = "4. Zone Resources: Include, Specific zone, then only the blog's domain. Leave Zone permissions out entirely when the blog has no custom domain."
step_env = "5. Create the token and copy it (Cloudflare shows it only once). In the blog folder, put it in `.env`, which git ignores:"
env_token = "<the token>"
env_account = "<account id, optional when the token sees one account>"
step_check = "6. Check it:"
never_share = "Never paste the token into a chat, an issue or a committed file. If it leaks, roll it on the API tokens page."
