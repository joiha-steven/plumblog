[cli.finding.theme_load]
what = "The theme does not load: {detail}"
fix = "Fix what the message names; `blog theme check` loads the theme exactly as the blog does."

[cli.finding.theme_template]
what = "Template error: {detail}"
fix = "Fix the template at that line and run the check again."

[cli.finding.theme_dark_token]
what = "Color `{name}` has a {have} value but no {missing} value."
fix = "Add `{name}` to [colors.{missing}] in theme.toml; both modes define the same colors."

[cli.finding.theme_contrast]
what = "Low contrast in {mode} mode: `{fg}` on `{bg}` is {ratio}:1, below {need}:1."
fix = "Change `{fg}` or `{bg}` in [colors.{mode}] (or the option that overrides it) until the ratio is at least {need}:1."

[cli.finding.theme_css_size]
what = "The stylesheet is {size} KB compressed; the limit is {max} KB."
fix = "Remove unused rules, or move styles most readers do not need into a style file chosen by an option."

[cli.finding.theme_js_size]
what = "The theme's scripts are {size} KB compressed; the limit is {max} KB."
fix = "Trim the scripts, or load rare ones only on the pages that need them with asset()."

[cli.finding.theme_hard_color]
what = "Fixed color {text} in a stylesheet; styles use colors from theme.toml only."
fix = "Define the color in [colors.light] and [colors.dark], and use var(--c-<name>) here."

[cli.finding.theme_locale_key]
what = "Text key `{key}` has no text in language {lang}, or in English."
fix = "Add the key to locales/en.toml, and to the other language files the theme ships."

[cli.finding.theme_page_problem]
what = "A page was left incomplete: {detail}"
fix = "Fix the part the message names."

[cli.finding.theme_asset_missing]
what = "Uses {asset}, which is not in the theme's assets/ folder; the live site answers 404 for it."
fix = "Add the file to assets/, or stop using it. A template the theme does not have comes from the default theme: copy it into templates/ to change it."

[cli.finding.file_secret_name]
what = "This file looks like a secret ({why}), and every file in a theme or plugin is public."
fix = "Delete it from the folder. If it held a real secret, treat the secret as leaked and replace it."

[cli.finding.file_secret_content]
what = "This looks like a {name}, and every file in a theme or plugin is public."
fix = "Delete it from the file and revoke it where it was issued: treat it as leaked."

[cli.finding.file_stray]
what = "This file is outside the allowed layout ({layout})."
fix = "Move it into one of those, or delete it."

[cli.finding.file_symlink]
what = "A symbolic link: it is not followed, and would not be part of the theme."
fix = "Replace it with a real copy of the file."

[cli.finding.file_admin]
what = "This file targets the admin. No theme or plugin file ever runs in the admin."
fix = "Delete it, and do not name files admin*."

[cli.finding.file_too_many]
what = "More files than a theme or plugin has; the rest were not read."
fix = "Check that this is the right folder, and remove files that do not belong."

[cli.finding.theme_too_large]
what = "The theme's text files make a theme.json of {size} KB; the limit is {max} KB, and the site would show the default theme."
fix = "Move large text out of templates, styles and locales (images and fonts belong in assets/, which do not count), or trim it."

[cli.finding.file_too_large]
what = "Larger than {max} bytes, the most a theme file may be."
fix = "Make it smaller, or remove it from the folder."

[cli.finding.file_not_text]
what = "Not UTF-8 text. Outside assets/, a theme holds only text files."
fix = "Save it as UTF-8, or move it into assets/ if it is not text."

[cli.finding.file_asset_name]
what = "Asset file names may use only A-Z, a-z, 0-9, dot, _ and - in each part of the path."
fix = "Rename the file or folder (for example, spaces to -), and update what links to it."

[cli.finding.text_hard]
what = "Fixed text {text} in a template. Text shown to readers belongs in locales/."
fix = "Add the text to locales/en.toml (and the other languages) and call t(\"section.key\") here."

[cli.finding.plugin_load]
what = "The plugin does not load: {detail}"
fix = "Fix what the message names; `blog plugin check` loads the plugin exactly as the blog does."

[cli.finding.plugin_broken]
what = "The plugin breaks a page on the default theme: {detail}"
fix = "Fix the partial or option the message names. A plugin that fails is left out of the page and disabled."

[cli.finding.plugin_css_size]
what = "With this plugin enabled the stylesheet is {size} KB compressed; the limit is {max} KB."
fix = "Trim the plugin's CSS."

[cli.guide_token]
# `blog guide token`. Button and field names (Create Token, Account Resources...) are the
# Cloudflare dashboard's own English labels; keep them as they are.
title = "# Cloudflare API token"
intro = "How to create the API token `blog` uses (generated from the code's table of API calls)."
global_key = "Never use the Global API Key: it can change everything in every account you own, and `blog` cannot use it. Create a scoped API token instead."
step_open = "1. Open {page}, choose Create Token, then Custom token."
step_permissions = "2. Under Permissions, add one row per line below, choosing the three dropdowns as shown."
account_heading = "Account permissions (always needed):"
zone_heading = "Zone permissions (only when the blog uses a custom domain):"
table_head = "| Type | Permission | Access | Used to |"
step_account_resources = "3. Account Resources: Include, then your one account (not All accounts)."
step_zone_resources = "4. Zone Resources: Include, Specific zone, then only the blog's domain. Leave Zone permissions out entirely when the blog has no custom domain."
step_env = "5. Create the token and copy it (Cloudflare shows it only once). In the blog folder, put it in `.env`, which git ignores:"
env_token = "<the token>"
env_account = "<account id, optional when the token sees one account>"
step_check = "6. Check it:"
never_share = "Never paste the token into a chat, an issue or a committed file. If it leaks, roll it on the API tokens page."

