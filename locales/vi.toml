migration_restore_pending = "Lần chạy trước, cập nhật cơ sở dữ liệu {name} bị lỗi, nên cơ sở dữ liệu có thể mới được cập nhật một nửa. Hãy khôi phục trước: `{restore}` (mốc Time Travel {bookmark}); trước khi khôi phục xong, đừng thay đổi gì khác trên trang. Khi lỗi này còn được ghi trong {path}, blog không chạy cập nhật nào và giữ nguyên mốc đó. Nếu bạn đã tự khôi phục bằng cách khác, hãy thêm --clear-failed-migration."
database_foreign = "Cơ sở dữ liệu D1 {name} đã có bảng ({tables}) nhưng không có bảng d1_migrations, nên không phải do blog tạo. blog không đụng vào nó. Hãy chọn tên khác bằng --name, hoặc tự xoá cơ sở dữ liệu đó nếu không cần."
script_foreign = "Tài khoản này đã có Worker tên {name}, và blog không tạo nó cho trang này (nó không có dấu {binding} và thư mục này không có ghi nhận về nó). blog không thay đổi gì: nếu tiếp tục, blog sẽ công khai Worker đó trên workers.dev và thay mã của nó. Hãy chọn tên khác bằng --name."
rollback_unrecorded = "blog không có ghi nhận phiên bản {version} cần những cập nhật cơ sở dữ liệu nào (nó không do blog đưa lên từ thư mục này), nên quay về nó có thể chạy mã cũ trên cơ sở dữ liệu mới hơn. Chưa thay đổi gì. Thêm --allow-older nếu bạn cố ý."
rollback_older = "Phiên bản {version} thiếu những cập nhật cơ sở dữ liệu đã chạy ({list}): quay về nó sẽ chạy mã cũ trên cấu trúc dữ liệu mới hơn. Chưa thay đổi gì. Hãy chọn phiên bản mới hơn, hoặc thêm --allow-older nếu bạn cố ý."
turnstile_ambiguous = "Có nhiều widget Turnstile cùng tên {name} (site key: {sitekeys}), blog không biết trang đang dùng cái nào. Chưa có gì thay đổi. Hãy xoá các widget thừa trên trang quản trị Cloudflare (mục Turnstile), rồi chạy lại `blog setup`."
guide_unknown = "Không có hướng dẫn nào tên {topic}"
tries = { other = "{count} lần thử" }
not_set_up = "Thư mục này chưa có trang nào ({path} chưa có hoặc thiếu thông tin). Hãy chạy `blog setup` ở đây trước."
bundle_missing = "--build chỉ chạy được trong kho mã plumblog (ở đây không có scripts/build-bundle). Hãy chạy ở đó, hoặc bỏ --build để đưa lên gói phát hành của bản blog này. Chưa có gì thay đổi."
build_failed = "Dựng gói bị lỗi ({detail}); phần in ở trên cho biết lý do. Chưa có gì thay đổi trên Cloudflare."
bundle_invalid = "Không dùng được gói này: {path}: {reason}. Chưa có gì thay đổi trên Cloudflare."
dump_row_too_large = "Dòng {key} của bảng {table} dài {bytes} byte khi viết thành SQL, quá {limit} byte mà D1 nhận trong một câu lệnh, nên bản sao lưu có dòng này sẽ không khôi phục được. Chưa ghi tệp nào; chưa cập nhật cơ sở dữ liệu và chưa đưa gì lên. Hãy làm dòng đó ngắn lại rồi chạy lại blog deploy."
backup_unwritable = "Không lưu được bản xuất cơ sở dữ liệu vào {path}: {reason}. Chưa cập nhật cơ sở dữ liệu và chưa đưa gì lên."
backup_row_too_large = "Dòng {key} của bảng {table} dài {bytes} byte khi viết thành SQL, quá {limit} byte mà D1 nhận trong một câu lệnh, nên bản sao lưu có dòng này sẽ không khôi phục được. Chưa ghi tệp nào. Hãy làm dòng đó ngắn lại rồi chạy lại blog backup."
backup_file_unwritable = "Không lưu được bản xuất cơ sở dữ liệu vào {path}: {reason}. Chưa sao lưu được gì."
backup_key_unsafe = "Từ chối khoá media {key}: đây không phải đường dẫn tương đối an toàn. Tệp này không được chép."
backup_size_mismatch = "{key}: Cloudflare gửi {got} byte nhưng cơ sở dữ liệu ghi {want}. Không lưu."
backup_checksum_mismatch = "{key}: dữ liệu không khớp mã kiểm tra của Cloudflare ({etag}). Không lưu."
backup_object_missing = "{key}: cơ sở dữ liệu có ghi nhưng R2 không có tệp này."
backup_object_failed = "{key}: không đọc được: {reason}"
backup_object_too_big = "{key}: lớn hơn giới hạn tải lên ({limit} byte). Không chép."
backup_row_invalid = "Dòng media {id}: {reason}. Các tệp của dòng này không được chép."
backup_media_unwritable = "Không ghi được {path}: {reason}. Hãy sửa rồi chạy lại blog backup: lệnh sẽ làm tiếp từ chỗ dừng."
backup_incomplete = "Bản sao lưu chưa đầy đủ: {failed} tệp bị lỗi và {missing} tệp bị thiếu (đã chép {objects} tệp). Các dòng phía trên nói rõ tệp nào; chạy lại blog backup để thử lại."
backup_missing = "Bản sao lưu chưa đầy đủ: {missing} tệp mà cơ sở dữ liệu ghi nhận không có trong R2 ({list}), {failed} tệp bị lỗi, đã chép {objects} tệp. Nếu tệp nào cũng thiếu thì nhiều khả năng quyền R2 của token, bucket hoặc đường dẫn tệp bị sai, chứ không phải tệp đã mất. Hãy kiểm tra lại rồi chạy lại blog backup."
admin_reset_foreign = "Chưa có gì thay đổi. Worker {worker} hoặc cơ sở dữ liệu của nó không mang dấu của thư mục này (biến {binding} và mã trang mà blog setup đã ghi), nên có thể đó là trang của người khác. Hãy chạy `blog setup` trong thư mục này một lần (lệnh không đổi gì đã có, chỉ ghi lại các dấu), rồi thử lại."
admin_reset_unmarked = "Chưa có gì thay đổi. Worker {worker} chưa có biến {binding} (được dựng bằng bản blog cũ, hoặc đã quay về một bản trước khi có biến này), nên thư mục này chưa chứng minh được trang là của nó. Hãy chạy `blog setup` trong thư mục này (lệnh ghi lại dấu), rồi `blog deploy` (chỉ lần deploy mới đưa dấu lên Worker), rồi thử lại."
admin_reset_unconfirmed = "Chưa có gì thay đổi. Nếu đúng ý bạn, chạy lại đúng lệnh đó kèm --yes."
admin_reset_ambiguous = "Chưa có gì thay đổi. Trang có nhiều chủ ({list}): chọn người cần đặt lại bằng --login."
admin_reset_not_owner = "Chưa có gì thay đổi. {login} không phải chủ đang hoạt động của trang này. Các chủ: {list}."
admin_reset_no_owner = "Chưa có gì thay đổi. Trang chưa có chủ: hãy chạy `blog setup` để lấy mã thiết lập."
restore_unconfirmed = "Chưa có gì thay đổi. Khôi phục {path} sẽ thay toàn bộ cơ sở dữ liệu như liệt kê phía trên, và huỷ các truy vấn đang chạy. Nếu đúng ý bạn, chạy lại đúng lệnh đó kèm --yes."
restore_unreadable = "Không đọc được {path}: {reason}. Chưa có gì thay đổi."
restore_not_a_backup = "{path} không phải bản sao lưu cơ sở dữ liệu do blog tạo: {reason}. Chưa có gì thay đổi."
restore_other_site = "{path} là bản sao lưu của một trang khác (mã trang của nó là {theirs}, của trang này là {ours}). Chưa có gì thay đổi. Chỉ khi bạn muốn trang này thành bản sao của trang kia, chạy lại kèm --allow-other-site."
restore_backup_newer = "{path} do mã mới hơn tạo: nó có migration mà blog này chưa biết ({list}). Chưa có gì thay đổi. Hãy cập nhật blog (blog update) trước rồi mới khôi phục."
restore_upload_failed = "Tải tệp lên Cloudflare không được: {reason}. Cơ sở dữ liệu chưa bị thay đổi; hãy chạy lại lệnh khôi phục."
restore_upload_mismatch = "Tệp tới Cloudflare bị hỏng (mã kiểm tra {got}, đúng ra phải là {want}). Cơ sở dữ liệu chưa bị thay đổi; hãy chạy lại lệnh khôi phục."
restore_import_failed = "Cloudflare không nạp được tệp: {detail}. Khi nạp lỗi, D1 tự đưa cơ sở dữ liệu về như cũ; hãy kiểm tra lại trang. Nếu trang không như cũ, huỷ bằng `{undo}`."
restore_count_mismatch = "Đã nạp xong nhưng cơ sở dữ liệu có ít dòng hơn trong tệp (bảng, số dòng trong tệp -> số dòng hiện có: {tables}). Các bản cập nhật cơ sở dữ liệu và phiên bản bộ nhớ đệm vẫn đã được đưa lên mới nhất. Hãy huỷ lần khôi phục bằng `{undo}` rồi kiểm tra lại tệp."
restore_import_uncertain = "Đã gửi lệnh nạp nhưng blog không thấy được lúc nó xong: {detail}. Có thể tệp đã được nạp. Đừng chạy lại lệnh khôi phục khi chưa kiểm tra: xem trang trước, nếu sai thì huỷ bằng `{undo}`."
smoke_rolled_back = "Phiên bản mới {version} không qua được kiểm tra: {seen}. Đã tự quay lại: phiên bản {previous} lại chạy trang. Các bản cập nhật cơ sở dữ liệu vẫn giữ nguyên; chúng chạy được với phiên bản trước. Lần đưa lên này được ghi trong {path}."
smoke_rollback_failed = "Phiên bản mới {version} không qua được kiểm tra: {seen}. Quay lại phiên bản {previous} cũng bị lỗi: {error} Có thể phiên bản mới vẫn đang chạy trang. Hãy chạy `blog rollback --to {previous}`."
smoke_no_previous = "Phiên bản mới {version} không qua được kiểm tra: {seen}. Trước đó không có phiên bản nào để quay lại, nên nó vẫn đang chạy trang."
rollback_smoke_failed = "Phiên bản {version} không qua được kiểm tra: {seen}. Quay lại phiên bản {previous}, bản chạy trước khi quay lại, cũng bị lỗi: {error} Hãy chạy `blog rollback --to {previous}`."
smoke_base_refused = "{var} chỉ dùng khi chạy thử và phải là địa chỉ trên chính máy này, ví dụ http://127.0.0.1:8787, không phải {value}."
rollback_no_record = "Trong {path} không có lần đưa lên nào ghi phiên bản trước đó, nên blog không biết phải quay về phiên bản nào. Hãy thêm --to <mã-phiên-bản> với một trong các phiên bản gần đây của Worker."
rollback_version_unknown = "{version} không phải một trong các phiên bản gần đây của Worker (Cloudflare chỉ đưa lên lại được 100 phiên bản gần nhất). Gần nhất: {list}"
rollback_db_unconfirmed = "Khôi phục cơ sở dữ liệu về mốc {bookmark} sẽ ghi đè toàn bộ cơ sở dữ liệu bằng trạng thái lúc đó: mọi thứ lưu sau thời điểm ấy (bài viết, bình luận, người dùng, cài đặt) sẽ mất, và các truy vấn đang chạy sẽ bị huỷ. Nếu đúng ý bạn, hãy chạy lại với --yes: `blog rollback --db {bookmark} --yes`"
deploy_locked = "Đang có một lần blog setup, deploy hoặc rollback khác chạy cho thư mục này ({path} đang có: {reason}). Hãy đợi nó xong. Nếu không có lần nào đang chạy (một lần chạy bị dừng giữa chừng), hãy xoá {path} rồi thử lại."
bundle_symlink = "Gói có một liên kết tượng trưng (symlink): {path}. Gói phải chứa file thật; hãy chép file vào. Chưa có gì thay đổi trên Cloudflare."
bundle_older = "Gói cũ hơn cơ sở dữ liệu: thiếu các bản cập nhật cơ sở dữ liệu đã chạy ({list}). Đưa gói này lên là chạy mã cũ trên cấu trúc dữ liệu mới. Hãy đưa lên gói mới hơn, hoặc thêm --allow-older nếu bạn cố ý (bản cập nhật chỉ đảm bảo chạy được với bản phát hành ngay trước)."
cron_failed = "Phiên bản {version} đã được đưa lên và qua kiểm tra, nhưng đặt lịch chạy định kỳ bị lỗi: {error} Bài hẹn giờ và webhook sẽ chờ tới khi lịch được đặt. Hãy chạy lại blog deploy; lệnh sẽ đặt lại lịch."
rollback_placeholder = "Phiên bản {version} là bản tạm blog setup tải lên (trả lời 503 cho mọi truy cập), nên blog không quay về nó. Hãy dùng --to với một mã phiên bản thật, hoặc đưa lên lại."
rollback_smoke_restored = "Phiên bản {version} không qua được kiểm tra: {seen}. Phiên bản {previous}, bản chạy trước khi quay lại, đã chạy trang trở lại."
restore_unsaved = "Cơ sở dữ liệu đã được khôi phục về mốc {bookmark}; đừng chạy khôi phục lần nữa. Nhưng lưu file trạng thái bị lỗi: {error} Lệnh huỷ khôi phục đã in ở trên."
release_dev_build = "Bản blog này được dựng từ mã nguồn nên không có gói phát hành để đưa lên. Người phát triển: chạy blog deploy --build trong kho mã plumblog, hoặc thêm --bundle <thư-mục>. Chủ blog: dùng bản blog đã phát hành ở {page}. Chưa có gì thay đổi."
release_download_failed = "Tải {url} không được: {detail}. Kiểm tra mạng rồi thử lại. Chưa có gì thay đổi."
release_not_found = "Không có {url} (HTTP 404). Có thể bản phát hành chưa được công bố; xem {page}. Chưa có gì thay đổi."
release_redirect_refused = "Lượt tải bị chuyển sang {host}, không phải kho file phát hành của GitHub, nên blog dừng lại. Chưa có gì thay đổi. Thử lại sau; nếu vẫn bị, hãy tải lại blog từ trang phát hành."
release_base_refused = "{var} chỉ được trỏ tới máy chủ thử nghiệm trên chính máy này (http://127.0.0.1:<cổng> hoặc http://[::1]:<cổng>); không dùng \"{value}\". Bỏ biến này đi để tải từ GitHub."
release_hash_mismatch = "Gói phát hành {file} không phải gói dành cho bản blog này: mã SHA-256 của nó là {got}, nhưng blog cần {want}. Chưa đưa gì lên. Hãy xoá thư mục {dir} rồi chạy lại blog deploy. Nếu vẫn bị, file tải về không phải file chính thức: cập nhật blog (`blog update`) hoặc tải lại blog từ {page}."
release_archive_invalid = "Không dùng được file nén của bản phát hành: {path}: {reason}. Chưa đưa lên hay cài gì. Nếu vẫn bị, hãy tải lại blog từ trang phát hành."
release_version_mismatch = "Gói phát hành là phiên bản {got}, còn blog này là {want}. Chưa đưa gì lên. Chạy `blog update`, hoặc tải bản blog khớp từ trang phát hành."
release_cache_unwritable = "Không dùng được thư mục tải về {path}: {reason}. Kiểm tra xem bạn có quyền ghi ở đó không. Chưa đưa gì lên."
release_reply_invalid = "Không đọc được câu trả lời của GitHub về bản phát hành mới nhất ({detail}). Thử lại sau, hoặc chỉ rõ phiên bản bằng --to vX.Y.Z."
update_no_key = "Bản blog này không có khoá ký bản phát hành, nên không kiểm được bản cập nhật có thật sự do nhóm plumblog làm ra hay không, và sẽ không cài. Hãy tự tải blog từ {page}. Chưa có gì thay đổi."
update_signature_missing = "Bản phát hành {tag} không có chữ ký (SHA256SUMS.minisig) nên không kiểm được. Chưa có gì thay đổi. Thử lại sau, hoặc tải blog từ {page}."
update_signature_invalid = "Chữ ký trên danh sách file của bản phát hành {tag} không hợp lệ ({reason}): các file này không phải thứ nhóm plumblog đã ký. Chưa có gì thay đổi. Đừng tự cài chúng; hãy báo lại ở {page}."
update_key_mismatch = "Danh sách file của bản phát hành {tag} được ký bằng khoá {got}, nhưng blog này chỉ tin khoá {want}. Chưa có gì thay đổi. Hãy tự tải blog từ {page} và đọc ghi chú phát hành."
update_hash_mismatch = "{file} không khớp với danh sách file đã ký (mã SHA-256 của nó là {got}, cần {want}): file tải về bị hỏng hoặc không phải file chính thức. Chưa có gì thay đổi. Chạy lại blog update; nếu vẫn bị, hãy tải blog từ {page}."
update_downgrade = "Bản phát hành {target} cũ hơn blog này ({current}), nên blog update không quay về bản cũ. Chưa thay đổi gì. Nếu vẫn muốn cài: blog update --to {tag} --allow-older"
update_version_invalid = "\"{value}\" không phải số phiên bản. Hãy viết dạng vX.Y.Z, ví dụ v0.2.0."
update_no_build = "Bản phát hành {tag} không có blog cho máy này ({target}). Chưa có gì thay đổi. Xem {page}."
update_replace_failed = "Không thay được {path}: {reason}. Blog hiện tại vẫn chạy và không bị đổi. Hãy chuyển blog sang thư mục bạn có quyền ghi, hoặc chạy blog update với quyền sửa file đó."
